<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="brand">
            <div class="logo">✓</div>

            <div>
                <h1>My Tasks</h1>
                <p>Plan your day. Stay organized.</p>
            </div>
        </div>

        <button id="themeBtn" class="theme-btn">
            ☾
        </button>

    </header>


    <!-- Statistics -->
    <section class="stats">

        <div class="stat-card">
            <span id="totalCount">0</span>
            <p>Total Tasks</p>
        </div>

        <div class="stat-card">
            <span id="activeCount">0</span>
            <p>Active</p>
        </div>

        <div class="stat-card">
            <span id="completedCount">0</span>
            <p>Completed</p>
        </div>

    </section>


    <!-- Progress -->
    <section class="progress-card">

        <div class="progress-info">
            <span>Today's Progress</span>
            <strong id="progressText">0%</strong>
        </div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

    </section>


    <!-- Add Task -->
    <section class="add-task-card">

        <div class="input-row">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
            >

            <button id="addBtn">
                + Add Task
            </button>

        </div>

        <div class="options-row">

            <select id="priorityInput">

                <option value="low">
                    Low Priority
                </option>

                <option value="medium" selected>
                    Medium Priority
                </option>

                <option value="high">
                    High Priority
                </option>

            </select>


            <select id="categoryInput">

                <option value="Personal">
                    Personal
                </option>

                <option value="College">
                    College
                </option>

                <option value="Work">
                    Work
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <input
                type="date"
                id="dateInput"
            >

        </div>

    </section>


    <!-- Search -->
    <div class="search-box">

        <span>⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
        >

    </div>


    <!-- Controls -->
    <div class="controls">

        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all">
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active">
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed">
                Completed
            </button>

        </div>


        <select id="sortSelect">

            <option value="newest">
                Newest
            </option>

            <option value="oldest">
                Oldest
            </option>

            <option value="priority">
                Priority
            </option>

            <option value="date">
                Due Date
            </option>

        </select>

    </div>


    <!-- Tasks -->
    <section class="task-section">

        <div class="section-title">
            <h2>Tasks</h2>
            <span id="remainingText">
                0 remaining
            </span>
        </div>

        <ul id="taskList"></ul>


        <div id="emptyState" class="empty-state">

            <div class="empty-icon">✓</div>

            <h3>No tasks found</h3>

            <p>
                Add a task to start organizing your day.
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <span>Stay focused. Get things done.</span>

        <button id="clearCompleted">
            Clear completed
        </button>

    </footer>

</div>


<!-- Edit Modal -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Edit Task</h2>

            <button id="closeModal">
                ×
            </button>

        </div>


        <label>Task</label>

        <input
            type="text"
            id="editTaskInput"
        >


        <label>Priority</label>

        <select id="editPriority">

            <option value="low">
                Low Priority
            </option>

            <option value="medium">
                Medium Priority
            </option>

            <option value="high">
                High Priority
            </option>

        </select>


        <label>Category</label>

        <select id="editCategory">

            <option value="Personal">
                Personal
            </option>

            <option value="College">
                College
            </option>

            <option value="Work">
                Work
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>Due Date</label>

        <input
            type="date"
            id="editDate"
        >


        <button
            id="saveEdit"
            class="save-btn">
            Save Changes
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
